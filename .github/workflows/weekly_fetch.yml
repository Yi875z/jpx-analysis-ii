name: JPX 週次データ取得・AIレポート生成

# トリガー:
#   1. 正: Cloudflare Worker（jpx-report-scheduler）からの workflow_dispatch。平日 15:45 / 17:15 JST
#      （JPX の公表は第4営業日 15:30。設定は JPX_Analysis_System リポの scheduler/src/index.js の SCHEDULE）
#   2. 予備: 平日 09:17 UTC（= 18:17 JST）の schedule。Worker が止まったときの保険
#   3. GitHub の Actions タブからの手動実行（workflow_dispatch・入力なしなら通常の週次）
#
# Worker を正にした理由（2026-10-02）: schedule は実測で毎回4〜8時間遅れて起動していた
# （18:17 指定 → 22:32〜翌02:39 JST）。workflow_dispatch は約20秒で始まる。
#
# 平日毎日走らせる理由: JPXは通常木曜公表だが、祝日の分だけ後ろへずれる
# （2026-07-20 海の日の週は金曜、9月の連休明けは火曜・木曜）。
# main.py 側に「掴んだ週が生成済みなら何もせず終了」のガードがあるため、
# 新データが無い日は1分ほどで静かに終わり、AIの費用も発生しない。
#
# 注意: 予備 schedule の分は意図的に 00 を避け 17 にしている（毎時00分は混雑して遅延・取りこぼしが増える）。
on:
  schedule:
    - cron: '17 9 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '対象週末日 YYYY-MM-DD（空欄なら直近金曜を自動検出）'
        required: false
        type: string
      mode:
        description: '実行モード'
        required: false
        type: choice
        default: 'weekly'
        options:
          - weekly        # 通常の週次取得＋AIレポート
          - report-only   # 既存DBデータからAIレポートのみ再生成
          - monthly       # 月次レポート（input.date を YYYY-MM として解釈）
      force:
        description: '生成済みの週でも強制的に再取得・再生成する'
        required: false
        type: boolean
        default: false
      source:
        # Worker は worker を渡す（jpx-report-scheduler の全ジョブ共通の入力名。受け付けないと Worker の起動が 422 になる）。
        # 処理には使っていない。実行履歴で起動元を見分けるための印。
        description: '起動元（手動実行は manual のままでよい）'
        required: false
        default: manual
        type: string

# Worker・予備 schedule・手動が重なっても同時には走らせない（キャンセルせず順番待ち）。
# 後から走る方は「生成済み」を見て静かにスキップするので、同じ週を二重に生成しない。
concurrency:
  group: jpx-weekly-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Tokyo
      # Supabase URL は公開情報なので直接記載
      SUPABASE_URL: https://syyojlcrnachuvrbvttw.supabase.co
      # 機密キーは GitHub Secrets から
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
      # アラートメール送信を有効化したい場合（任意）
      SMTP_HOST:         ${{ secrets.SMTP_HOST }}
      SMTP_PORT:         ${{ secrets.SMTP_PORT }}
      SMTP_USER:         ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      NOTIFY_EMAIL:      ${{ secrets.NOTIFY_EMAIL }}
      # オプション設定
      # 2026-07-27 A/Bテスト（7/17週で Opus 4.8 と3構成比較）の結果 Opus 5 に切替。
      # 正確性は互角、個人のプット売り越しを捕捉する等で分析の鋭さが上回った。
      # Opus 5 は適応思考が既定で有効なため report_agent.py 側で
      # max_tokens=32000 + streaming が前提になっている（切断防止）。
      # バージョンは固定指定＝新モデルが出ても自動では変わらない（意図的）。
      # 新Opusが出たら outputs/ab_test/ の手順でA/B比較してからここを変更する。
      # 2026-09-26 A/B（9/11週で Opus 5 high / Opus 5.5 medium・high）の結果 Opus 5.5 に切替。
      # Opus 5.5 は effort の既定が medium（Opus 5 は high）なので、report_agent.py の
      # DEFAULT_EFFORT で明示している。拒否（refusal）時は Opus 5 で1回だけ書き直す。
      CLAUDE_MODEL: claude-opus-5-5
      OUTPUT_DIR: ./outputs
      LOG_DIR:    ./logs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # レポート生成規律の回帰テスト（AI呼び出しなし・1秒未満）。
      # NT方向判定・時間軸判定・異種原資産の枚数合算禁止が壊れた状態で
      # 本番レポートを作らないよう、取得の前に落とす。
      - name: Run report rule regression tests
        run: python -m pytest tests/ -q

      - name: Run JPX weekly fetch
        id: fetch
        run: |
          set -e
          MODE="${{ inputs.mode || 'weekly' }}"
          DATE_ARG="${{ inputs.date }}"
          FORCE_ARG=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE_ARG="--force"; fi

          echo "Mode: $MODE"
          echo "Date: ${DATE_ARG:-(auto)}"
          echo "Force: ${FORCE_ARG:-(no)}"
          echo "TZ:   $TZ"
          date

          rm -f outputs/last_run_status.txt outputs/last_run_error.txt

          case "$MODE" in
            weekly)
              if [ -n "$DATE_ARG" ]; then
                python main.py --date "$DATE_ARG" $FORCE_ARG
              else
                python main.py $FORCE_ARG
              fi
              ;;
            report-only)
              if [ -n "$DATE_ARG" ]; then
                python main.py --report-only --date "$DATE_ARG"
              else
                python main.py --report-only
              fi
              ;;
            monthly)
              python main.py --monthly "$DATE_ARG"
              ;;
          esac

      - name: Detect whether a new report was generated
        id: status
        if: success()
        run: |
          # weekly モード以外は last_run_status.txt を書かないので generated 扱いにする。
          STATUS=$(cut -d' ' -f1 outputs/last_run_status.txt 2>/dev/null || echo generated)
          echo "Run status: $STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # 新規レポートを生成した時だけ送る。
      # スキップ時に送ると「前週のレポート」が今週分として届いてしまうため。
      - name: Send summary mail (on success)
        if: success() && steps.status.outputs.status == 'generated'
        run: python scripts/send_summary_mail.py

      - name: Note skipped run
        if: success() && steps.status.outputs.status != 'generated'
        run: |
          echo "::notice::JPX未公表のため新規レポートなし（status=${{ steps.status.outputs.status }}）。メール送信はスキップしました。"

      # 取得・整合性の異常（現物が読めない・週が合わない・前週の取りこぼし等）は
      # main.py が exit 1 にする。GitHub 標準の失敗通知だけに頼らず、理由付きでメールする。
      - name: Send failure mail
        if: failure()
        run: python scripts/send_summary_mail.py --failure || true

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== logs/ ==="
          ls -la logs/ 2>/dev/null || echo "(no logs/ directory)"
          for f in logs/*.log; do
            [ -f "$f" ] || continue
            echo "─── $f ───"
            tail -80 "$f"
          done

      - name: Upload artifacts (logs & latest alert) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_id }}
          path: |
            logs/
            outputs/alerts/
          retention-days: 14
          if-no-files-found: ignore
